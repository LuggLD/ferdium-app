# LuggLD fork: build and publish a fork release for every push to `luggld`.
#
# Version: <upstream base>-luggld.<n>, e.g. 7.2.4-luggld.1 (see .github/fork/release.js).
# Release notes: fork header + upstream's notes for that base.
# Installed fork builds auto-update from these releases (electron-builder.fork.js).
#
# Secrets: CSC_LINK (base64 .p12 with the Apple Development certificate and
# key) and CSC_KEY_PASSWORD, for signing the macOS builds.
name: LuggLD release

on:
  push:
    branches: [luggld]
    # CI-only changes don't change the app.
    paths-ignore:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luggld-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/ferdium/ferdium-app.git

jobs:
  checks:
    name: Typecheck, lint and tests
    runs-on: macos-15
    steps:
      - name: Require the macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # An unsigned macOS build would not auto-update over the signed
          # ones and would lose macOS permissions; never publish one.
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Secrets CSC_LINK and CSC_KEY_PASSWORD must be set (see the header of this workflow)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/luggld-setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Real-Electron test (service pages unload on quit)
        run: pnpm test:integration

  prepare:
    name: Create draft release
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream release tags
        run: git fetch --no-tags "$UPSTREAM_URL" 'refs/tags/v*:refs/tags/v*'
      - name: Work out the fork version
        id: version
        run: |
          VERSION="$(node .github/fork/release.js next-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Fork version: $VERSION"
      - name: Write release notes
        run: node .github/fork/release.js notes > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release (replacing a leftover draft from a failed run)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Ferdium $VERSION (LuggLD fork)" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/luggld-setup
      - name: Stamp the fork version into package.json
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('node:fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.version = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
      - name: Build and upload to the draft release (macOS, signed)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # Same steps as package.json's "build" script, with the fork's config.
        # (Not `pnpm build --config ...`: pnpm would take --config for itself.)
        run: |
          pnpm exec preval-build-info-cli
          node esbuild.mjs
          node ./node_modules/electron-builder/cli.js --publish always --config electron-builder.fork.js
      - name: Build and upload to the draft release (Windows/Linux, unsigned)
        if: runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec preval-build-info-cli
          node esbuild.mjs
          node ./node_modules/electron-builder/cli.js --publish always --config electron-builder.fork.js

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # Ferdium's "beta" setting makes the updater read luggld*.yml instead of
      # latest*.yml for luggld versions; serve the same feeds under both names.
      - name: Add luggld*.yml copies of the update feeds
        run: |
          mkdir feeds && cd feeds
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'latest*.yml'
          for feed in latest*.yml; do cp "$feed" "luggld${feed#latest}"; done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" luggld*.yml --clobber
      - name: Publish and mark as latest
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
